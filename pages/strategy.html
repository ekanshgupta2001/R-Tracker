<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <!-- v2 theme: `light` = light glass and is the default; no class = dark glass. rt-theme is the only localStorage key in the app (UI preference). -->
  <script>document.documentElement.classList.add('light');try{if(localStorage.getItem('rt-theme')==='dark')document.documentElement.classList.remove('light')}catch(e){}</script>
  <title>Strategy Planner — R-Tracker</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/strategy.css">
  <script src="../js/schema.js"></script>
  <script src="../js/store.js"></script>
  <script defer src="../js/sidebar.js"></script>
</head>

<body>
<a href="#main-content" class="skip-to-content">Skip to main content</a>
<div id="rt-overlay" aria-hidden="true"><div id="rt-overlay-logo"><span class="ol-r">R-</span><span class="ol-t">Tracker</span></div></div>
<div id="rt-atmosphere" aria-hidden="true"></div>
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <a href="../index.html" class="home-btn">&larr; Home</a>
      <span class="topbar-sep" aria-hidden="true"></span>
      <span class="topbar-title">Strategy Planner</span>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="openStratModal('load')"><span class="rt-icon" data-rt-icon="folder"></span>Load</button>
      <button class="topbar-btn" onclick="openStratModal('save')"><span class="rt-icon" data-rt-icon="save"></span>Save</button>
      <button class="topbar-btn" onclick="stratExportPNG()"><span class="rt-icon" data-rt-icon="camera"></span>Export PNG</button>
      <button class="topbar-btn" onclick="togglePresentation()"><span class="rt-icon" data-rt-icon="play"></span>Present</button>
    </div>
  </header>

  <main class="main-wrap" id="main-content">
    <!-- Field Panel -->
    <div class="field-panel" id="fieldPanel">
      <canvas id="strategyCanvas"></canvas>

      <!-- Floating Toolbar -->
      <div class="strat-toolbar" id="stratToolbar">
        <!-- Drawing Tools -->
        <button class="tool-btn active" data-tool="draw" onclick="setTool('draw')" title="Draw" aria-label="Draw"><span class="rt-icon" data-rt-icon="pencil"></span></button>
        <button class="tool-btn" data-tool="arrow" onclick="setTool('arrow')" title="Arrow" aria-label="Arrow"><span class="rt-icon" data-rt-icon="arrowRight"></span></button>
        <button class="tool-btn" data-tool="rect" onclick="setTool('rect')" title="Rectangle" aria-label="Rectangle"><span class="rt-icon" data-rt-icon="square"></span></button>
        <button class="tool-btn" data-tool="circle" onclick="setTool('circle')" title="Circle" aria-label="Circle"><span class="rt-icon" data-rt-icon="circle"></span></button>
        <button class="tool-btn" data-tool="text" onclick="setTool('text')" title="Text" aria-label="Text">T</button>
        <button class="tool-btn" data-tool="robot" onclick="setTool('robot')" title="Robot" aria-label="Robot"><span class="rt-icon" data-rt-icon="robot"></span></button>
        <button class="tool-btn" data-tool="waypoint" onclick="setTool('waypoint')" title="Waypoint" aria-label="Waypoint"><span class="rt-icon" data-rt-icon="disc"></span></button>
        <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser')" title="Eraser" aria-label="Eraser"><span class="rt-icon" data-rt-icon="eraser"></span></button>

        <div class="sep"></div>

        <!-- Colors -->
        <button class="color-swatch active" data-color="#ff4444" style="background:#ff4444" onclick="setColor('#ff4444')"></button>
        <button class="color-swatch" data-color="#4488ff" style="background:#4488ff" onclick="setColor('#4488ff')"></button>
        <button class="color-swatch" data-color="#44ff88" style="background:#44ff88" onclick="setColor('#44ff88')"></button>
        <button class="color-swatch" data-color="#ffaa00" style="background:#ffaa00" onclick="setColor('#ffaa00')"></button>
        <button class="color-swatch" data-color="#ff44ff" style="background:#ff44ff" onclick="setColor('#ff44ff')"></button>
        <button class="color-swatch" data-color="#ffffff" style="background:#ffffff" onclick="setColor('#ffffff')"></button>

        <div class="sep"></div>

        <!-- Line Widths -->
        <button class="width-btn" data-width="2" onclick="setLineWidth(2)"><span class="width-dot" style="width:4px;height:4px"></span></button>
        <button class="width-btn active" data-width="4" onclick="setLineWidth(4)"><span class="width-dot" style="width:7px;height:7px"></span></button>
        <button class="width-btn" data-width="8" onclick="setLineWidth(8)"><span class="width-dot" style="width:11px;height:11px"></span></button>

        <div class="sep"></div>

        <!-- Undo / Redo / Clear -->
        <button class="act-btn" id="undoBtn" onclick="stratUndo()" disabled title="Undo (Ctrl+Z)" aria-label="Undo"><span class="rt-icon" data-rt-icon="undo"></span></button>
        <button class="act-btn" id="redoBtn" onclick="stratRedo()" disabled title="Redo (Ctrl+Y)" aria-label="Redo"><span class="rt-icon" data-rt-icon="redo"></span></button>
        <button class="act-btn" onclick="stratClearAll()" title="Clear All" aria-label="Clear all"><span class="rt-icon" data-rt-icon="trash"></span></button>
      </div>

      <!-- Text Input Overlay -->
      <div class="text-input-overlay" id="textInputOverlay">
        <input class="text-input-field" id="textInputField" type="text" placeholder="Type text...">
      </div>

      <!-- Notes expand button (when panel is collapsed) -->
      <button class="notes-expand-btn" id="notesExpandBtn" onclick="toggleNotes()" title="Show notes" aria-label="Show notes"><span class="rt-icon" data-rt-icon="chevronLeft"></span></button>

      <!-- Minimap -->
      <div class="minimap-wrap">
        <canvas id="minimapCanvas"></canvas>
      </div>
    </div>

    <!-- Notes Panel -->
    <div class="notes-panel" id="notesPanel">
      <div class="notes-header">
        <span class="notes-title">Strategy Notes</span>
        <button class="notes-toggle" onclick="toggleNotes()" title="Collapse">&times;</button>
      </div>
      <textarea id="strategyNotes" placeholder="Write your strategy notes here...&#10;&#10;Example:&#10;- Auto: Score specimen, pick up samples&#10;- TeleOp: Focus on high basket&#10;- Endgame: Park in observation zone"></textarea>
      <div class="notes-footer">Notes are saved with your strategy</div>
    </div>
  </main>

  <!-- Save/Load Modal -->
  <div id="strat-modal-backdrop" onclick="if(event.target===this)closeStratModal()">
    <div id="strat-modal">
      <div class="sm-header">
        <div class="sm-title" id="sm-title">Save Strategy</div>
        <button class="sm-close" onclick="closeStratModal()">&#10005;</button>
      </div>
      <div class="sm-input-row" id="sm-save-row">
        <input id="sm-name-input" class="sm-input" type="text" placeholder="Strategy name (e.g. Match 1 Plan)"
               onkeydown="if(event.key==='Enter')saveStrategy()">
        <button class="sm-save-btn" onclick="saveStrategy()">Save</button>
      </div>
      <div id="sm-load-section" style="display:none">
        <div class="sm-section-title">Your Saved Strategies</div>
        <div id="sm-strat-list"><div class="sm-empty">Loading...</div></div>
      </div>
      <div class="sm-msg" id="sm-msg"></div>
    </div>
  </div>

  <!-- Presentation exit hint -->
  <div class="present-exit-hint">Press ESC to exit presentation</div>

  <script defer src="../js/utils/validators.js"></script>
  <!-- Strategy Engine -->
  <script defer src="../js/strategy.js"></script>
<script>
(function() {
  var overlay = document.getElementById('rt-overlay');
  if (!overlay) return;
  if (sessionStorage.getItem('rt-nav') === '1') {
    sessionStorage.removeItem('rt-nav');
    overlay.classList.add('visible');
    setTimeout(function() {
      overlay.classList.remove('visible');
      document.body.classList.add('rt-entering');
    }, 200);
    setTimeout(function() { document.body.classList.remove('rt-entering'); }, 400);
  }
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.hasAttribute('download') || href.startsWith('blob:')) return;
    if (href.startsWith('http') && href.indexOf(location.host) === -1) return;
    if (link.target === '_blank') return;
    e.preventDefault();
    sessionStorage.setItem('rt-nav', '1');
    overlay.classList.add('visible');
    setTimeout(function() { window.location.href = href; }, 150);
  });
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) {
      overlay.classList.remove('visible');
      document.body.classList.remove('rt-entering');
    }
  });
})();
</script>
</body>
</html>
