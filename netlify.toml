# R-Tracker v2 — static site. No build step, no functions, no redirects.
# Every request is a same-origin GET for a file in this repo (see AUDIT.md).

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # 'unsafe-inline' is required: every page uses inline <script> blocks, on*="" handlers
    # and style="" attributes, and there is no build step to add nonces. connect-src 'none'
    # and default-src 'self' still forbid any request to another origin. Keep this string
    # identical to the <meta http-equiv="Content-Security-Policy"> on every page (minus
    # frame-ancestors, which is ignored in meta) — tests/network-audit.spec.js checks that.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cache-Control = "no-store"
